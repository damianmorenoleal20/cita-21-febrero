<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Una invitación especial ✨</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    min-height:100vh;
    font-family:'Poppins',sans-serif;
    color:#fff;
    overflow:hidden;
    background:#000;
}

/* 🌌 Cielo animado */
.cielo{
    position:fixed;
    inset:0;
    background:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 80% 40%, #fff, transparent),
      radial-gradient(1px 1px at 60% 70%, #fff, transparent),
      radial-gradient(2px 2px at 30% 80%, #fff, transparent),
      radial-gradient(1px 1px at 90% 20%, #fff, transparent),
      linear-gradient(#0b0f2a, #000);
    animation:moverCielo 70s linear infinite;
    z-index:1;
}

@keyframes moverCielo{
    from{background-position:0 0}
    to{background-position:1200px 800px}
}

/* ☁️ Nubes */
.nube{
    position:absolute;
    top:10%;
    width:220px;
    height:70px;
    background:rgba(255,255,255,0.15);
    border-radius:50px;
    filter:blur(6px);
    animation: moverNube linear infinite;
    z-index:2;
}

.nube::before,
.nube::after{
    content:"";
    position:absolute;
    background:rgba(255,255,255,0.18);
    width:90px;
    height:90px;
    border-radius:50%;
    top:-40px;
}

.nube::before{left:30px}
.nube::after{right:30px}

@keyframes moverNube{
    from{transform:translateX(-300px)}
    to{transform:translateX(120vw)}
}

/* 🌕 Luna con fases */
.luna{
    position:absolute;
    top:40px;
    right:40px;
    width:140px;
    height:140px;
    border-radius:50%;
    background:
      radial-gradient(circle at 30% 30%, #fff, #ddd 40%, #bbb 60%, #aaa 100%);
    box-shadow:
      inset -12px -12px 25px rgba(0,0,0,0.35),
      inset 8px 8px 20px rgba(255,255,255,0.3),
      0 0 50px 20px rgba(255,255,255,0.7);
    overflow:hidden;
    z-index:4;
}

.fase{
    position:absolute;
    width:100%;
    height:100%;
    background:#000;
    border-radius:50%;
    animation:fases 20s infinite linear;
}

@keyframes fases{
    0%   {transform:translateX(100%)}
    25%  {transform:translateX(50%)}
    50%  {transform:translateX(0)}
    75%  {transform:translateX(-50%)}
    100% {transform:translateX(-100%)}
}

/* 💎 Tarjeta */
.card{
    position:relative;
    z-index:5;
    max-width:420px;
    margin:auto;
    top:50%;
    transform:translateY(-50%);
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(14px);
    border-radius:25px;
    padding:45px 30px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.45);
    animation:fadeIn 1.5s ease;
}

h1{
    font-family:'Playfair Display',serif;
    font-size:2.2em;
    margin-bottom:10px;
}

.date{
    font-size:1.2em;
    margin-bottom:20px;
}

p{
    font-size:1.05em;
    line-height:1.7;
    margin-bottom:20px;
}

.contador{
    font-size:1.05em;
    background:rgba(255,255,255,0.25);
    padding:12px;
    border-radius:15px;
    margin-bottom:20px;
}

.heart{
    font-size:2.6em;
    animation:heartbeat 1.5s infinite;
}

.button{
    display:inline-block;
    margin-top:20px;
    padding:14px 32px;
    background:#fff;
    color:#ff5a8a;
    text-decoration:none;
    border-radius:30px;
    font-weight:500;
    transition:0.3s;
}

.button:hover{
    transform:scale(1.08);
    background:#ffe3ec;
}

/* 💖⭐ Lluvia */
.falling{
    position:absolute;
    top:-10%;
    animation:fall linear infinite;
    z-index:3;
    opacity:0.9;
}

@keyframes fall{
    0%{transform:translateY(0) rotate(0deg)}
    100%{transform:translateY(120vh) rotate(360deg)}
}

@keyframes heartbeat{
    0%{transform:scale(1)}
    50%{transform:scale(1.25)}
    100%{transform:scale(1)}
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(25px)}
    to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<div class="cielo"></div>

<!-- ☁️ Nubes -->
<div class="nube" style="top:18%;animation-duration:60s"></div>
<div class="nube" style="top:32%;animation-duration:75s;opacity:0.12"></div>
<div class="nube" style="top:48%;animation-duration:90s;opacity:0.1"></div>

<!-- 🎶 Música -->
<audio autoplay loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_0b6f8bba65.mp3" type="audio/mpeg">
</audio>

<!-- 🌕 Luna -->
<div class="luna">
    <div class="fase"></div>
</div>

<div class="card">
    <h1>Una invitación especial</h1>
    <div class="date">📅 21 de febrero de 2026</div>

    <p>
        Bajo la luna cambiante y un cielo cubierto de nubes,
        me gustaría compartir contigo una noche inolvidable.
    </p>

    <div class="contador" id="contador">Cargando contador…</div>

    <p>¿Aceptarías salir conmigo ese día?</p>

    <div class="heart">❤️</div>

    <a class="button" href="#" onclick="alert('Prometo que será una cita inolvidable ✨')">
        Aceptar invitación
    </a>
</div>

<script>
/* ⏳ Contador */
function actualizarContador(){
    const fecha = new Date("2026-02-21T00:00:00");
    const ahora = new Date();
    const diff = fecha - ahora;

    if(diff <= 0){
        document.getElementById("contador").innerHTML =
        "✨ ¡Hoy es nuestra cita! ✨";
        return;
    }

    const d = Math.floor(diff/(1000*60*60*24));
    const h = Math.floor((diff/(1000*60*60))%24);
    const m = Math.floor((diff/(1000*60))%60);
    const s = Math.floor((diff/1000)%60);

    document.getElementById("contador").innerHTML =
    `⏳ Faltan <strong>${d}</strong> días, <strong>${h}</strong> horas,
     <strong>${m}</strong> minutos y <strong>${s}</strong> segundos`;
}
setInterval(actualizarContador,1000);
actualizarContador();

/* 💖⭐ Lluvia */
function crearElemento(simbolo, tamaño, duracion){
    const el = document.createElement("div");
    el.className = "falling";
    el.innerHTML = simbolo;
    el.style.left = Math.random()*100 + "vw";
    el.style.fontSize = tamaño + "px";
    el.style.animationDuration = duracion + "s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), duracion*1000);
}

setInterval(()=>crearElemento("❤️", 18, 6), 320);
setInterval(()=>crearElemento("⭐", 14, 8), 520);
</script>

</body>
</html>
